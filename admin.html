<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | أ. عبدالعزيز الفيفي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-glow: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            color: var(--primary-glow);
            margin-bottom: 5px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 50px auto;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            color: #fff;
            box-sizing: border-box;
            font-family: 'Tajawal';
        }

        .btn {
            background: var(--primary-glow);
            color: #000;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-green { background: var(--accent-green); color: #fff; }
        .btn-red { background: var(--accent-red); color: #fff; width: auto; padding: 6px 12px; }

        .dashboard-content {
            display: none;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-user-shield"></i> لوحة إدارة بوابة الكفايات</h1>
        <p>أ. عبدالعزيز الفيفي - ثانوية الأمير عبدالمجيد 😉</p>
    </header>

    <!-- شاشة تسجيل الدخول البسيطة -->
    <div id="loginSection" class="login-box">
        <h3><i class="fas fa-lock"></i> تسجيل الدخول</h3>
        <div class="input-group">
            <label>رمز المرور الإداري:</label>
            <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="checkAuth()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardSection" class="dashboard-content">
        
        <!-- إضافة نموذج/رابط جديد -->
        <div class="item-card" style="border-color: var(--primary-glow);">
            <h3 style="margin: 0; color: var(--primary-glow);"><i class="fas fa-plus-circle"></i> إضافة نموذج / اختبار جديد</h3>
            <div class="item-grid">
                <div class="input-group">
                    <label>معرف النموذج (ID فريد):</label>
                    <input type="text" id="newId" placeholder="مثال: exam-grammar-6">
                </div>
                <div class="input-group">
                    <label>عنوان النموذج:</label>
                    <input type="text" id="newTitle" placeholder="مثال: نموذج (6): الجملة الاسمية">
                </div>
                <div class="input-group">
                    <label>الوحدة / القسم:</label>
                    <select id="newCategory">
                        <option value="grammar">الكفاية النحوية</option>
                        <option value="spelling">الكفاية الإملائية</option>
                        <option value="comprehensive">اختبارات شاملة</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>رابط النموذج (URL):</label>
                    <input type="text" id="newUrl" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label>تاريخ ووقت الفتح:</label>
                    <input type="datetime-local" id="newStart">
                </div>
                <div class="input-group">
                    <label>تاريخ ووقت الإغلاق:</label>
                    <input type="datetime-local" id="newEnd">
                </div>
            </div>
            <button class="btn btn-green" onclick="saveNewModel()"><i class="fas fa-save"></i> حفظ ونشر النموذج</button>
        </div>

        <!-- قائمة النماذج الحالية -->
        <h2><i class="fas fa-list"></i> النماذج والأدوات المنشورة</h2>
        <div id="modelsContainer">
            <p>جاري تحميل البيانات من Firebase... ⏳</p>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // رمز المرور الافتراضي (يمكنك تغييره من هنا)
    const PASS_CODE = "123456";

    function checkAuth() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === PASS_CODE) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadDashboardData();
        } else {
            alert('كلمة المرور غير صحيحة ❌');
        }
    }

    function loadDashboardData() {
        db.collection("portal_links").onSnapshot(snapshot => {
            const container = document.getElementById('modelsContainer');
            if (snapshot.empty) {
                container.innerHTML = "<p>لا توجد نماذج مضافة حتى الآن.</p>";
                return;
            }

            let html = "";
            snapshot.forEach(doc => {
                let item = doc.data();
                html += `
                    <div class="item-card">
                        <div class="item-header">
                            <strong style="color: var(--primary-glow);">${item.title}</strong>
                            <button class="btn btn-red" onclick="deleteItem('${doc.id}')"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                        <div class="item-grid">
                            <div class="input-group">
                                <label>رابط النموذج:</label>
                                <input type="text" value="${item.url}" id="url_${doc.id}">
                            </div>
                            <div class="input-group">
                                <label>تاريخ الفتح:</label>
                                <input type="datetime-local" value="${item.start}" id="start_${doc.id}">
                            </div>
                            <div class="input-group">
                                <label>تاريخ الإغلاق:</label>
                                <input type="datetime-local" value="${item.end}" id="end_${doc.id}">
                            </div>
                        </div>
                        <button class="btn" onclick="updateItem('${doc.id}')"><i class="fas fa-sync"></i> تحديث المواعيد والرابط</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        });
    }

    function saveNewModel() {
        const id = document.getElementById('newId').value.trim();
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('newCategory').value;
        const url = document.getElementById('newUrl').value.trim();
        const start = document.getElementById('newStart').value;
        const end = document.getElementById('newEnd').value;

        if (!id || !title || !url) {
            alert('يرجى ملء جميع الحقول المطلوبة (المعرف، العنوان، والرابط)');
            return;
        }

        db.collection("portal_links").doc(id).set({
            title: title,
            category: category,
            url: url,
            start: start,
            end: end,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert('تمت إضافة النموذج بنجاح! 🚀');
            document.getElementById('newId').value = '';
            document.getElementById('newTitle').value = '';
            document.getElementById('newUrl').value = '';
        }).catch(err => alert('حدث خطأ: ' + err.message));
    }

    function updateItem(id) {
        const url = document.getElementById(`url_${id}`).value;
        const start = document.getElementById(`start_${id}`).value;
        const end = document.getElementById(`end_${id}`).value;

        db.collection("portal_links").doc(id).update({
            url: url,
            start: start,
            end: end
        }).then(() => {
            alert('تم تحديث بيانات النموذج بنجاح 🟢');
        }).catch(err => alert('حدث خطأ أثناء التحديث: ' + err.message));
    }

    function deleteItem(id) {
        if (confirm('هل أنت تأكد من رغبتك في حذف هذا النموذج؟')) {
            db.collection("portal_links").doc(id).delete();
        }
    }
</script>

</body>
              </html>
